name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    name: ruff + mypy + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy app

      - name: Migration filename sanity
        # Catches duplicate-prefix and bad-shape filenames in migrations/
        # before they reach a deploy. Cheap, no Supabase access needed.
        # The runtime drift gate (registry vs files) lives in
        # app/core/migration_check.py and runs at app boot.
        run: python scripts/check_migration_numbers.py

      - name: Test (pytest)
        run: pytest -q
