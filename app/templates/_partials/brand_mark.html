{% macro wordmark(class_name="") %}
<a href="/" class="brand-lockup {{ class_name }}" aria-label="babyg">
  <span class="brand-mark sm"><img src="/static/assets/logo-bg.png" alt="babyg" /></span>
  <span class="logo-text">babyg</span>
</a>
{% endmacro %}

{% macro icon(class_name="") %}
<span class="{{ class_name }}" aria-label="babyg">
  <img src="/static/assets/logo-bg.png" alt="babyg" style="width:28px;height:28px;object-fit:contain;filter:drop-shadow(0 0 4px rgba(160,200,255,0.45));" />
</span>
{% endmacro %}
