{# CSS-built placeholder marks until final brand assets exist.
   Direction: abstract manager mark + quiet babyg label. #}

{% macro wordmark(class_name="") %}
<span class="brand-mark brand-mark-lockup {{ class_name }}" aria-label="babyg">
  {{ icon("brand-mark-symbol-inline") }}
  <span class="brand-mark-name">babyg</span>
</span>
{% endmacro %}

{% macro icon(class_name="") %}
<span class="brand-mark brand-mark-symbol {{ class_name }}" aria-label="babyg">
  <span class="brand-symbol-frame" aria-hidden="true">
    <span class="brand-symbol-stem"></span>
    <span class="brand-symbol-dot brand-symbol-dot-a"></span>
    <span class="brand-symbol-dot brand-symbol-dot-b"></span>
  </span>
</span>
{% endmacro %}
