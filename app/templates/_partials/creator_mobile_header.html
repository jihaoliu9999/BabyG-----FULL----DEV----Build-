{% set path = request.url.path %}
{% set is_detail = path.count('/') > 2 and not path.startswith('/creator/bot') %}

<header class="mobile-header" id="mobile-header">
  {% if is_detail %}
  <button class="icon-btn" onclick="history.back()" aria-label="back">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  {% else %}
  <span class="brand-lockup" id="mh-brand">
    <span class="brand-mark sm"><img src="/static/assets/logo-bg.png" alt="" /></span>
    <span class="logo-text">babyg</span>
  </span>
  {% endif %}
  <span></span>
  <a href="/creator/profile" class="mobile-profile-link" aria-label="profile">
    {% if profile is defined and profile is not none and profile.profile_photo_url %}
    <img src="{{ profile.profile_photo_url }}" alt="" />
    {% else %}
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
    {% endif %}
  </a>
</header>
