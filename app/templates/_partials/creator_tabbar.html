{% set path = request.url.path %}
<nav class="mobile-tabbar creator-tabbar" aria-label="creator app navigation">
  <a href="/creator" {% if path == "/creator" %}aria-current="page"{% endif %}>today</a>
  <a href="/creator/bot" {% if path.startswith("/creator/bot") %}aria-current="page"{% endif %}>ask</a>
  <a href="/creator/connections" {% if path.startswith("/creator/connections") or path.startswith("/creator/network") %}aria-current="page"{% endif %}>connections</a>
  <a href="/creator/jobs" {% if path.startswith("/creator/jobs") %}aria-current="page"{% endif %}>opportunities</a>
  <a href="/creator/calendar" {% if path.startswith("/creator/calendar") %}aria-current="page"{% endif %}>schedule</a>
  <a href="/creator/performance" {% if path.startswith("/creator/performance") or path.startswith("/creator/receipts") or path.startswith("/creator/views") %}aria-current="page"{% endif %}>performance</a>
  <a href="/creator/dm" {% if path.startswith("/creator/dm") %}aria-current="page"{% endif %}>inbox</a>
</nav>
