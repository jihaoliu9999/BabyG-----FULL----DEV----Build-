[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "N814"]
# FastAPI Depends/Form/Query/Body factories are designed to live in argument
# defaults; B008 is a known false positive for that pattern.
"app/main.py" = ["B008"]
"app/routes/*" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]
